# Runs the stack: PostgreSQL with schema and seed data, the API, and the web app (nginx). See docs/design.md → Overview.
# Works with `docker compose` and the legacy `docker-compose`; no feature newer than the legacy binary is used.
# Values come from .env when present (copy .env.example); a missing .env is not an error.
# The schema and seed load only on the first start of an empty volume: `docker compose down -v` resets the data.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskapp}
      POSTGRES_DB: taskapp
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    # Published on localhost only, for inspecting data with a database client: user and database taskapp.
    # Not 5432, so a local PostgreSQL does not stop the app from starting.
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    healthcheck:
      # -h 127.0.0.1: during init the image runs a socket-only server, which a bare pg_isready reports as ready.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "taskapp", "-d", "taskapp"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://taskapp:${POSTGRES_PASSWORD:-taskapp}@db:5432/taskapp
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}
    # Published on localhost only, for direct API access.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Open http://localhost:8080 (WEB_PORT).
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Database for the backend tests only; the commands, including the wait for it to accept connections, are in
  # README.md → Tests. Each test file creates its own schema, so this starts empty. Its data lives in memory and
  # disappears when it stops. Profiles need docker-compose 1.28 or later.
  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  db-data:
