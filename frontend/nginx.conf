# Serves the built SPA and proxies /api to the api service, so the browser sees one origin and needs no CORS.
server {
  listen 80;
  root /usr/share/nginx/html;
  # Redirects nginx makes (e.g. /api to /api/) keep the browser's host port, which nginx inside the container can't know.
  absolute_redirect off;

  # Docker's embedded DNS; answers are cached for 10 s.
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    # A variable makes nginx look up api per request through the resolver above, so a recreated api
    # container's new IP is found and nginx starts even while api is down. A literal host is resolved once.
    set $api http://api:3000;
    proxy_pass $api;
    # Above the worst-case Save wait: 2 × LLM_TIMEOUT_MS, at most 50 s; backend/test/config.test.ts checks this.
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
  }

  # Built assets have content hashes in their names, so they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    # Unknown paths serve the SPA, so reloading /tasks/new works.
    try_files $uri /index.html;
    # index.html names the current asset hashes, so the browser must recheck it after each rebuild.
    add_header Cache-Control "no-cache";
  }
}
